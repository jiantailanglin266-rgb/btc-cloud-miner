# BTC CLOUD MINER — ローカル本番相当環境
#
#   docker compose up -d
#   docker compose exec app npx prisma migrate deploy
#   docker compose exec app npx tsx prisma/seed.ts   # デモデータ（本番では実行しない）
#
# 環境変数ゼロでも app はデモモードで動くが、compose では Postgres / Redis を含めた
# 本番相当の構成を検証できるようにしてある。

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bcm:bcm_local_password@db:5432/btc_cloud_miner?schema=public
      REDIS_URL: redis://cache:6379
      # ★ 本番では必ず固有の値を Secrets Manager から注入すること
      # ENCRYPTION_KEY: <hex 64 文字>
      MINING_PROVIDER_MODE: mock
      WALLET_PROVIDER_MODE: mock
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bcm
      POSTGRES_PASSWORD: bcm_local_password
      POSTGRES_DB: btc_cloud_miner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm -d btc_cloud_miner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # ローカル検証用。本番はマネージド DB（RDS 等）+ Multi-AZ + PITR を使うこと

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- バックアップの例（本番はマネージドバックアップを使う） ---------------
  # backup:
  #   image: postgres:16-alpine
  #   depends_on: [db]
  #   entrypoint: >
  #     sh -c 'while true; do
  #       pg_dump postgresql://bcm:bcm_local_password@db:5432/btc_cloud_miner
  #         | gzip > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz;
  #       sleep 86400;
  #     done'
  #   volumes:
  #     - ./backups:/backups

volumes:
  pgdata:
